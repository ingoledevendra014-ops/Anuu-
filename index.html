<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Anushka ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Georgia,serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#180014,#4b0828,#12000f);
    color:white;
}

.page{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    animation:fade 1s ease;
}

.page.active{
    display:flex;
}

.content{
    width:100%;
    max-width:700px;
}

h1{
    font-size:42px;
    margin-bottom:20px;
}

h2{
    font-size:30px;
    margin-bottom:18px;
}

p{
    font-size:18px;
    line-height:1.8;
}

button{
    margin-top:30px;
    padding:14px 28px;
    border:none;
    border-radius:30px;
    background:#ff4f91;
    color:white;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 8px 25px #ff4f9166;
    transition:.3s;
}

button:hover{
    transform:scale(1.07);
}

/* Floating Hearts */

.heart{
    position:fixed;
    bottom:-30px;
    font-size:20px;
    animation:floatUp 7s linear infinite;
    opacity:.7;
    pointer-events:none;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(0);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

/* PHOTO ORBIT */

.orbit{
    width:380px;
    height:380px;
    margin:25px auto;
    position:relative;
    border-radius:50%;
    animation:orbitRotate 22s linear infinite;
}

.orbitRing{
    position:absolute;
    inset:0;
    border:1px solid #ffffff25;
    border-radius:50%;
}

.orbitPhoto{
    position:absolute;
    width:125px;
    height:165px;
    border-radius:18px;
    overflow:hidden;
    border:3px solid #ffffffcc;
    background:#111;
    box-shadow:0 10px 35px #0009;
}

.orbitPhoto img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.p1{
    top:-35px;
    left:127px;
}

.p2{
    top:45px;
    right:-45px;
}

.p3{
    bottom:45px;
    right:-45px;
}

.p4{
    bottom:-35px;
    left:127px;
}

.p5{
    bottom:45px;
    left:-45px;
}

.p6{
    top:45px;
    left:-45px;
}

@keyframes orbitRotate{
    0%{
        transform:rotate(0deg);
    }
    100%{
        transform:rotate(360deg);
    }
}

/* MEMORY PHOTO */

.memoryPhoto{
    width:280px;
    max-width:90%;
    border-radius:20px;
    margin:15px auto;
    display:block;
    box-shadow:0 15px 40px #0009;
}

/* LETTER */

.letter{
    background:#ffffff12;
    border:1px solid #ffffff25;
    border-radius:25px;
    padding:28px;
    max-height:70vh;
    overflow-y:auto;
    text-align:left;
    backdrop-filter:blur(10px);
}

.letter p{
    font-size:17px;
    line-height:1.9;
    margin-bottom:16px;
}

/* CONFETTI */

.confetti{
    position:fixed;
    width:8px;
    height:14px;
    top:-20px;
    animation:confettiFall 4s linear infinite;
    pointer-events:none;
}

@keyframes confettiFall{
    0%{
        transform:translateY(0) rotate(0);
    }
    100%{
        transform:translateY(110vh) rotate(720deg);
    }
}

@keyframes fade{
    from{
        opacity:0;
        transform:scale(.95);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@media(max-width:500px){

    h1{
        font-size:32px;
    }

    h2{
        font-size:25px;
    }

    p{
        font-size:16px;
    }

    .orbit{
        width:330px;
        height:330px;
    }

    .orbitPhoto{
        width:105px;
        height:140px;
    }

    .p1,.p4{
        left:112px;
    }

    .p2,.p3{
        right:-25px;
    }

    .p5,.p6{
        left:-25px;
    }

    .letter{
        padding:20px;
    }

    .letter p{
        font-size:15px;
    }
}
</style>
</head>

<body>

<audio id="song" loop>
    <source src="tu_mara_koi_na.mp3" type="audio/mpeg">
</audio>
